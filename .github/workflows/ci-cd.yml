name: Expense Tracker CI/CD

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
test:
name: Test Expense Tracker
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Check required files
    run: |
      test -f index.html
      test -f style.css
      test -f script.js
      test -f expense.js
      test -f package.json
      test -f tests/expense.test.js

  - name: Run automated tests
    run: npm test

  - name: Upload website artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: .
```

deploy:
name: Deploy to GitHub Pages
needs: test
runs-on: ubuntu-latest

```
permissions:
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Deploy website
    id: deployment
    uses: actions/deploy-pages@v4
```
